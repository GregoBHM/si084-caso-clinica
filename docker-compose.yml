# Canal digital de la Clínica Santa Lucía · tal como lo entregó el proveedor WebSur S.A.C.
# Simula en tu máquina lo que la clínica publica en internet. Solo escucha en 127.0.0.1.
name: clinica-canal-digital

services:
  portal:
    image: nginx:1.20-alpine
    container_name: csl_portal
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infraestructura/portal:/usr/share/nginx/html:ro
      - ./infraestructura/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro

  pruebas:
    image: nginx:1.20-alpine
    container_name: csl_pruebas
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./infraestructura/pruebas:/usr/share/nginx/html:ro
      - ./infraestructura/nginx/pruebas.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    image: nginx:1.20-alpine
    container_name: csl_api
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infraestructura/api:/usr/share/nginx/html:ro
      - ./infraestructura/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
